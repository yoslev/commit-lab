kind: ConfigMap
apiVersion: v1
metadata:
  name: aws-logging
  namespace: aws-observability
data:
  output.conf: |
    [OUTPUT]
        Name cloudwatch_logs
        Match   *
        region us-west-2
        log_group_name eks-fargate-logs
        log_stream_prefix from-fluent-bit-
        auto_create_group true

  filters.conf: |
    [FILTER]
        Name parser
        Match *
        Key_Name log
        Parser json

  parsers.conf: |
    [PARSER]
        Name json
        Format json
